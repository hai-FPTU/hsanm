<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Học sinh nhận thức an toàn thông tin</title>
  <meta name="description" content="Đề thi mẫu Vòng 1 – Cuộc thi FPTU Cyber Security dành cho học sinh THPT">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800&family=Patrick+Hand&display=swap&subset=vietnamese" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar" id="topbar" hidden>
    <div class="topbar__team" id="teamLabel"></div>
    <nav class="tabs" id="tabs" aria-label="Các chương"></nav>
    <div class="topbar__stats">
      <div class="stat"><span class="stat__label">Thời gian còn lại</span><span class="stat__value" id="timer">--:--</span></div>
      <button class="btn btn--stamp btn--sm" id="submitBtn">Nộp bài</button>
      <button class="icon-btn" id="soundBtn" aria-label="Tắt âm thanh" title="Bật/tắt âm thanh">🔊</button>
    </div>
  </header>

  <main id="app" class="app"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
